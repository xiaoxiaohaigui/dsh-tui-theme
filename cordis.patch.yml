# Bundle patch for dsh-tui-theme: insert the plugin as a profile row.
# The plugin only consumes optional seams (tuiStatus, tuiSettingsSections,
# settings, tuiToast) and never registers shortcuts or commands. Since 0.8 it
# ships no themes at all: the pink family is a dsh-TUI built-in, and the plugin
# only reads ~/.dsh-tui/theme.json to decide whether the blossom line shows.
- insert:
    - id: dsh-tui-theme
      name: 'dsh-tui-theme'
      config:
        statusEnabled: true
        statusGlyph: '✿'
        statusSeparator: '·'
        showGlyph: true
        showClock: true
        showTurns: true
        statusScope: pink-only
